kind = "web"
previewPath = "/"
title = "Mini AI"
version = "1.0.0"
id = "artifacts/mini-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19814

[services.development]
run = "pnpm --filter @workspace/mini-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mini-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/mini-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19814"
BASE_PATH = "/"
